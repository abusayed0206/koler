plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
}

android {
    namespace "com.chooloo.www.kontacts"
    compileSdk rootProject.ext.sdkVersion

    defaultConfig {
        versionCode 1
        versionName "1.0"
        applicationId "com.chooloo.www.kontacts"
        targetSdk rootProject.ext.sdkVersion
        minSdk rootProject.ext.minSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_18
        targetCompatibility JavaVersion.VERSION_18
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_18.toString()
    }

    kotlin { jvmToolchain(18) }
    kapt { correctErrorTypes true }
    lint { checkReleaseBuilds false }
    buildFeatures { viewBinding true }
    hilt { enableAggregatingTask true }
}

dependencies {
    kapt "com.google.dagger:hilt-compiler:${rootProject.ext.hiltVersion}"

    testImplementation "junit:junit:4.13.2"

    implementation project(":chooloolib")
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}"
}
