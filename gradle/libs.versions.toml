[versions]
agp = "9.5.0"
ksp = "2.3.12"
hilt = "2.60.1"
compileSdk = "37"
targetSdk = "33"
minSdk = "25"

[libraries]
androidx-activity = "androidx.activity:activity-ktx:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.2"
androidx-core = "androidx.core:core-ktx:1.19.1"
androidx-fragment = "androidx.fragment:fragment-ktx:1.9.1"
androidx-lifecycle-viewmodel = "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
androidx-preference = "androidx.preference:preference-ktx:1.2.1"
material = "com.google.android.material:material:1.14.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
# 3.5+ pulls kotlin-stdlib 2.4, newer than AGP's built-in Kotlin 2.2 compiler can read
coil = "io.coil-kt.coil3:coil:3.4.0"

# replaced in Phase 2
storio-contentresolver = "com.pushtorefresh.storio3:content-resolver:3.0.0"

junit = "junit:junit:4.13.2"
androidx-test-runner = "androidx.test:runner:1.7.0"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-espresso = "androidx.test.espresso:espresso-core:3.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
