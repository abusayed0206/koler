[versions]
agp = "9.5.0"
ksp = "2.3.12"
kotlin = "2.4.21"
hilt = "2.60.1"
compileSdk = "37"
targetSdk = "33"
minSdk = "25"

[libraries]
androidx-activity = "androidx.activity:activity-ktx:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.2"
androidx-core = "androidx.core:core-ktx:1.19.1"
androidx-fragment = "androidx.fragment:fragment-ktx:1.9.1"
androidx-lifecycle-viewmodel = "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
androidx-preference = "androidx.preference:preference-ktx:1.2.1"
material = "com.google.android.material:material:1.14.0"
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
coil = "io.coil-kt.coil3:coil:3.6.3"

junit = "junit:junit:4.13.2"
androidx-test-runner = "androidx.test:runner:1.7.0"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-espresso = "androidx.test.espresso:espresso-core:3.7.0"
androidx-test-core = "androidx.test:core-ktx:1.7.0"
androidx-arch-core-testing = "androidx.arch.core:core-testing:2.2.0"
mockk = "io.mockk:mockk:1.14.11"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
robolectric = "org.robolectric:robolectric:4.17"
truth = "com.google.truth:truth:1.4.5"

kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
