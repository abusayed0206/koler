plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace "com.chooloo.www.chooloolib"
    compileSdk libs.versions.compileSdk.get().toInteger()

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }
    lint { abortOnError false } // report-only until the Phase 5 lint cleanup

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    ksp libs.hilt.compiler

    testImplementation libs.junit

    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso

    // exposed to :koler and :kontacts, which build on chooloolib's base classes and widgets
    api libs.androidx.activity
    api libs.androidx.appcompat
    api libs.androidx.constraintlayout
    api libs.androidx.core
    api libs.androidx.fragment
    api libs.androidx.lifecycle.viewmodel
    api libs.androidx.preference
    api libs.material
    api libs.kotlinx.coroutines.android
    api libs.hilt.android

    implementation libs.picasso
    implementation libs.fastscroll
    implementation libs.circularimageview
    implementation libs.storio.contentresolver
}
