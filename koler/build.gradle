plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace "com.chooloo.www.koler"
    compileSdk libs.versions.compileSdk.get().toInteger()

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }

    defaultConfig {
        applicationId "com.chooloo.www.koler"
        versionCode 82
        versionName "v1.6.1"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    signingConfigs {
        // shared debug key so CI builds install over each other (debug only, not a secret)
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false // report-only until the Phase 5 lint cleanup
    }
}

dependencies {
    ksp libs.hilt.compiler

    testImplementation libs.junit

    implementation project(":chooloolib")
    implementation libs.hilt.android
}
