name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 18
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :koler:assembleDebug :kontacts:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            koler/build/outputs/apk/debug/*.apk
            kontacts/build/outputs/apk/debug/*.apk
