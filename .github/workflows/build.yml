name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          # default is read-only off the default branch; all work happens on feature branches
          cache-read-only: false
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: debug-apks
          path: |
            koler/build/outputs/apk/debug/*.apk
            kontacts/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/tests/
